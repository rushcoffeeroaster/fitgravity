/* ============================================================
   FIT GRAVITY · Training Online — space navy & gold (dark luxe)
   ============================================================ */
:root{
  color-scheme: dark;
  --bg:#0F1B33;
  --bg-grad: radial-gradient(135% 110% at 50% -10%, #1D3054 0%, #14223F 55%, #0C1729 100%);
  --surface:#1B2A4A; --surface-2:#16233E;
  --line:#28395C; --line-strong:#33476F;
  --ink:#EDF2FA; --ink-2:#A7B6CE; --ink-3:#67789A;
  --green:#57C68C; --green-bg:rgba(87,198,140,.14);
  --red:#F08066; --red-bg:rgba(240,128,102,.14);
  --amber:#F2B33D; --amber-bg:rgba(242,179,61,.14);
  --shadow-sm:0 1px 2px rgba(0,0,0,.28), 0 2px 10px rgba(0,0,0,.26);
  --shadow-md:0 8px 26px rgba(0,0,0,.45);
  --radius:16px; --radius-sm:11px;
  --accent:#F2A93B; --accent-deep:#FFC96B; --accent-soft:rgba(242,169,59,.15);
  --accent-grad:linear-gradient(135deg,#FFC85C 0%,#E8930C 100%);
  --metal-grad:linear-gradient(120deg,#D9922A 0%,#FFDD8C 48%,#C67F16 100%);
  --on-accent:#241703;
}
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; }
body{ font-family:"Inter","Noto Sans Thai",-apple-system,"Segoe UI",sans-serif;
  background:var(--bg);
  background-image:
    radial-gradient(1.4px 1.4px at 12% 18%, rgba(255,255,255,.30), transparent 60%),
    radial-gradient(1px 1px at 78% 8%, rgba(255,255,255,.22), transparent 60%),
    radial-gradient(1.2px 1.2px at 55% 30%, rgba(255,255,255,.16), transparent 60%),
    radial-gradient(1px 1px at 30% 62%, rgba(255,255,255,.13), transparent 60%),
    radial-gradient(1.3px 1.3px at 88% 45%, rgba(255,255,255,.18), transparent 60%),
    radial-gradient(1px 1px at 8% 84%, rgba(255,255,255,.15), transparent 60%),
    radial-gradient(1.2px 1.2px at 64% 78%, rgba(255,255,255,.12), transparent 60%),
    var(--bg-grad);
  background-attachment:fixed;
  color:var(--ink); padding-bottom:84px; -webkit-font-smoothing:antialiased; }
.wrap{ max-width:560px; margin:0 auto; padding:14px 16px 8px; }
.appbar{ position:sticky; top:0; z-index:40; background:rgba(13,23,44,.82); backdrop-filter:saturate(160%) blur(14px); border-bottom:1px solid var(--line); }
.appbar-inner{ max-width:560px; margin:0 auto; padding:11px 16px; display:flex; align-items:center; justify-content:space-between; gap:10px; }
.brand{ display:flex; align-items:center; gap:10px; min-width:0; }
.logo{ width:38px; height:38px; border-radius:12px; display:grid; place-items:center; color:var(--on-accent); background:var(--accent-grad); box-shadow:var(--shadow-sm), inset 0 1px 0 rgba(255,255,255,.4); flex-shrink:0; }
.logo svg{ width:21px; height:21px; }
.wordmark{ font-family:"Orbitron","Inter","Noto Sans Thai",sans-serif; font-weight:800; font-size:14px; letter-spacing:1.6px; line-height:1; background:var(--metal-grad); -webkit-background-clip:text; background-clip:text; color:transparent; }
.brand-tag{ font-size:10px; color:var(--ink-3); margin-top:3px; letter-spacing:2.2px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
h1{ font-size:20px; font-weight:800; margin:6px 0 2px; letter-spacing:.2px; }
h2{ font-size:15px; font-weight:800; margin:18px 0 10px; }
.sub{ color:var(--ink-2); font-size:12.5px; margin:0 0 14px; }
.tabs{ display:flex; gap:6px; background:var(--surface); border:1px solid var(--line); border-radius:13px; padding:4px; margin-bottom:14px; box-shadow:var(--shadow-sm); }
.tab{ flex:1; text-align:center; padding:9px; border-radius:9px; font-size:13.5px; font-weight:700; cursor:pointer; color:var(--ink-2); transition:.15s; }
.tab.active{ background:var(--accent-grad); color:var(--on-accent); box-shadow:var(--shadow-sm); }
input,select,textarea{ width:100%; border:1px solid var(--line-strong); border-radius:10px; padding:10px 11px; font-size:14px; background:var(--surface-2); color:var(--ink); font-family:inherit; transition:.15s; }
input::placeholder,textarea::placeholder{ color:var(--ink-3); }
input:focus,select:focus,textarea:focus{ outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
textarea{ resize:vertical; min-height:64px; }
.label{ font-size:12px; color:var(--ink-2); margin-bottom:5px; display:block; font-weight:600; }
.field{ margin-bottom:13px; }
.row{ display:flex; gap:8px; margin-bottom:11px; }
.btn-primary{ background:var(--accent-grad); color:var(--on-accent); border:none; border-radius:10px; padding:10px 16px; font-size:14px; font-weight:800; cursor:pointer; white-space:nowrap; box-shadow:var(--shadow-sm), inset 0 1px 0 rgba(255,255,255,.4); transition:.12s; }
.btn-primary:active{ transform:scale(.97); }
.btn-primary:disabled{ opacity:.55; }
.btn-block{ width:100%; padding:13px; }
.btn-ghost{ background:var(--surface); color:var(--ink-2); border:1px solid var(--line-strong); border-radius:10px; padding:10px 16px; font-size:13.5px; font-weight:700; cursor:pointer; }
.chip{ border:1px solid var(--line-strong); border-radius:999px; padding:7px 13px; font-size:13px; background:var(--surface); cursor:pointer; white-space:nowrap; color:var(--ink-2); font-weight:600; transition:.15s; }
.chip.active{ background:var(--accent-grad); color:var(--on-accent); border-color:transparent; box-shadow:var(--shadow-sm); }
.chiprow{ display:flex; gap:7px; overflow-x:auto; padding-bottom:11px; scrollbar-width:none; }
.chiprow::-webkit-scrollbar{ display:none; }
.card{ border:1px solid var(--line); border-radius:var(--radius); background:var(--surface); padding:15px; margin-bottom:11px; box-shadow:var(--shadow-sm); }
.toast{ position:fixed; bottom:96px; left:50%; transform:translateX(-50%); background:#EDF2FA; color:#14223F; padding:11px 20px; border-radius:999px; font-size:13px; font-weight:700; z-index:120; box-shadow:var(--shadow-md); white-space:nowrap; }
.err-box{ background:var(--red-bg); color:var(--red); border:1px solid rgba(240,128,102,.4); border-radius:10px; padding:10px 13px; font-size:13px; margin-bottom:13px; font-weight:600; }
.empty{ text-align:center; padding:42px 16px; color:var(--ink-3); font-size:14px; }
.loading-text{ color:var(--ink-3); font-size:14px; text-align:center; padding:36px 0; }
.bottom-nav{ position:fixed; left:0; right:0; bottom:0; z-index:60; background:rgba(18,30,55,.9); backdrop-filter:saturate(160%) blur(14px); border-top:1px solid var(--line); padding:7px 6px calc(7px + env(safe-area-inset-bottom)); }
.nav-inner{ display:flex; max-width:560px; margin:0 auto; gap:2px; }
.nav-item{ flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 2px; border-radius:13px; color:var(--ink-3); font-size:10px; font-weight:700; text-decoration:none; white-space:nowrap; transition:.15s; cursor:pointer; border:none; background:none; font-family:inherit; }
.nav-item svg{ width:21px; height:21px; }
.nav-item.active{ color:var(--accent-deep); background:var(--accent-soft); }

/* ==== components ==== */
.icon-btn{ width:36px; height:36px; border-radius:10px; border:1px solid var(--line-strong); background:var(--surface); display:grid; place-items:center; color:var(--ink-2); cursor:pointer; flex-shrink:0; }
.icon-btn svg{ width:18px; height:18px; }
.install-btn{ display:inline-flex; align-items:center; gap:5px; background:var(--accent-grad); color:var(--on-accent); border:none; border-radius:999px; padding:0 12px; height:34px; font-size:12px; font-weight:800; cursor:pointer; white-space:nowrap; box-shadow:var(--shadow-sm); flex-shrink:0; font-family:inherit; }
.install-btn svg{ width:15px; height:15px; }
.appbar-actions{ display:flex; gap:7px; }
.login-hero{ text-align:center; padding:26px 0 12px; }
.login-hero .biglogo{ width:70px; height:70px; border-radius:21px; margin:0 auto 14px; display:grid; place-items:center; color:var(--on-accent); background:var(--accent-grad); box-shadow:var(--shadow-md), inset 0 1px 0 rgba(255,255,255,.45); }
.login-hero .biglogo svg{ width:38px; height:38px; }
.login-hero .wm{ font-family:"Orbitron","Inter",sans-serif; font-weight:800; font-size:25px; letter-spacing:3px; background:var(--metal-grad); -webkit-background-clip:text; background-clip:text; color:transparent; }
.login-hero .wm2{ font-family:"Orbitron","Inter",sans-serif; font-weight:600; font-size:10px; letter-spacing:5px; color:var(--ink-3); margin-top:5px; }
.login-hero .tg{ font-size:12.5px; color:var(--ink-2); margin-top:10px; line-height:1.6; }
.promo-link{ display:flex; align-items:center; justify-content:center; gap:8px; margin-top:16px; padding:13px; border-radius:var(--radius-sm); border:1.5px dashed var(--line-strong); background:var(--surface-2); color:var(--ink-2); font-size:13px; font-weight:700; cursor:pointer; }
.promo-link svg{ width:18px; height:18px; color:var(--amber); flex-shrink:0; }
.promo-head{ background:var(--accent-grad); color:var(--on-accent); border-radius:var(--radius); padding:20px 17px; margin-bottom:12px; box-shadow:var(--shadow-md); }
.promo-head .k{ font-size:10.5px; font-weight:800; opacity:.75; letter-spacing:1.2px; }
.promo-head .t{ font-size:21px; font-weight:800; margin-top:4px; line-height:1.3; }
.promo-head .d{ font-size:12.5px; margin-top:7px; opacity:.85; line-height:1.5; font-weight:600; }
.type-chip{ display:inline-flex; align-items:center; gap:5px; padding:4px 11px; border-radius:999px; font-size:11px; font-weight:700; background:var(--accent-soft); color:var(--accent-deep); }
.type-chip.rest{ background:rgba(167,182,206,.13); color:var(--ink-2); }
.today-chip{ background:var(--accent); color:var(--on-accent); padding:3px 9px; border-radius:999px; font-size:10px; font-weight:800; }
.ex-row{ display:flex; align-items:flex-start; gap:10px; padding:10px 0; border-bottom:1px dashed var(--line); cursor:pointer; }
.ex-row:last-child{ border-bottom:none; padding-bottom:2px; }
.ex-check{ width:20px; height:20px; accent-color:var(--accent); margin-top:1px; flex-shrink:0; }
.ex-row.checked .ex-name{ text-decoration:line-through; color:var(--ink-3); }
.ex-name{ font-size:14px; font-weight:600; }
.ex-detail{ font-size:12px; color:var(--ink-2); margin-top:1px; }
.ex-media-row{ display:flex; align-items:center; gap:8px; margin-top:7px; flex-wrap:wrap; }
.ex-thumb{ width:44px; height:44px; border-radius:8px; object-fit:cover; border:1px solid var(--line-strong); cursor:pointer; flex-shrink:0; }
.ex-video-btn{ display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:700; color:var(--accent-deep); background:var(--accent-soft); border-radius:999px; padding:5px 11px; text-decoration:none; }
.ex-video-btn svg{ width:13px; height:13px; }
.day-card{ border:1px solid var(--line); border-radius:var(--radius); background:var(--surface); margin-bottom:9px; box-shadow:var(--shadow-sm); overflow:hidden; }
.day-head{ display:flex; align-items:center; gap:9px; padding:13px 15px; cursor:pointer; }
.day-head .dn{ font-size:14px; font-weight:800; flex:1; min-width:0; }
.day-head .dn .dt{ font-size:11.5px; color:var(--ink-2); font-weight:600; display:block; margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.day-body{ padding:0 15px 13px; border-top:1px solid var(--line); padding-top:9px; }
.caret{ width:16px; height:16px; color:var(--ink-3); transition:.2s; flex-shrink:0; }
.day-card.open .caret{ transform:rotate(180deg); }
.bubble-list{ display:flex; flex-direction:column; }
.bubble{ max-width:80%; padding:9px 12px; border-radius:14px; font-size:13.5px; margin-bottom:8px; line-height:1.5; white-space:pre-wrap; word-break:break-word; }
.bubble.me{ margin-left:auto; background:var(--accent-grad); color:var(--on-accent); border-bottom-right-radius:5px; box-shadow:var(--shadow-sm); font-weight:600; }
.bubble.coach{ margin-right:auto; background:var(--surface-2); border:1px solid var(--line); border-bottom-left-radius:5px; }
.bubble .meta{ font-size:10px; opacity:.65; margin-top:4px; }
.chatbox{ display:flex; gap:8px; margin-top:6px; }
.chatbox input{ flex:1; }
.stats{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:11px; }
.stat{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-sm); padding:12px 6px; text-align:center; box-shadow:var(--shadow-sm); }
.stat .v{ font-size:19px; font-weight:800; letter-spacing:.2px; }
.stat .l{ font-size:10.5px; color:var(--ink-2); margin-top:3px; font-weight:600; }
.stat .v small{ font-size:11px; font-weight:700; color:var(--ink-3); }
.good{ color:var(--green); } .bad{ color:var(--red); }
.chart-box{ position:relative; }
.chart-box svg{ display:block; width:100%; height:auto; touch-action:pan-y; }
.chart-tip{ position:absolute; top:6px; transform:translateX(-50%); background:#EDF2FA; color:#14223F; font-size:11px; font-weight:700; padding:5px 10px; border-radius:8px; white-space:nowrap; pointer-events:none; display:none; box-shadow:var(--shadow-md); }
.pkg-num{ font-size:34px; font-weight:800; line-height:1; color:var(--accent-deep); }
.pkg-bar{ height:10px; border-radius:999px; background:rgba(242,169,59,.14); overflow:hidden; margin:10px 0 7px; }
.pkg-fill{ height:100%; background:var(--accent-grad); border-radius:999px; transition:.3s; }
.warn-chip{ display:inline-flex; align-items:center; gap:5px; padding:4px 10px; border-radius:999px; font-size:11px; font-weight:700; background:var(--amber-bg); color:var(--amber); margin-right:6px; margin-top:6px; }
.warn-chip.red{ background:var(--red-bg); color:var(--red); }
.ticket{ position:relative; border:1px solid var(--line); border-radius:var(--radius); background:var(--surface); box-shadow:var(--shadow-sm); overflow:hidden; margin-bottom:11px; }
.ticket.dim{ opacity:.6; }
.ticket-top{ padding:14px 15px; display:flex; gap:11px; align-items:center; }
.ticket-ic{ width:42px; height:42px; border-radius:12px; display:grid; place-items:center; background:var(--accent-soft); color:var(--accent-deep); flex-shrink:0; }
.ticket-ic.coffee{ background:rgba(200,140,60,.16); color:#E3B26C; }
.ticket-ic svg{ width:22px; height:22px; }
.ticket-title{ font-size:14px; font-weight:800; line-height:1.35; }
.ticket-sub{ font-size:11.5px; color:var(--ink-2); margin-top:2px; }
.ticket-cut{ border-top:1.5px dashed var(--line-strong); position:relative; }
.ticket-cut::before,.ticket-cut::after{ content:""; position:absolute; top:-7px; width:14px; height:14px; border-radius:50%; background:var(--bg); border:1px solid var(--line); }
.ticket-cut::before{ left:-8px; } .ticket-cut::after{ right:-8px; }
.ticket-bottom{ padding:13px 15px; display:flex; align-items:center; gap:13px; }
.qr-slot{ width:96px; height:96px; flex-shrink:0; background:#fff; padding:5px; border:1px solid var(--line); border-radius:9px; cursor:pointer; }
.qr-slot img,.qr-slot canvas{ width:100% !important; height:100% !important; }
.qr-fallback{ font-size:9px; word-break:break-all; color:#333; }
.code-big{ font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:17px; font-weight:800; letter-spacing:1.5px; color:var(--accent-deep); }
.st-chip{ display:inline-block; padding:3px 10px; border-radius:999px; font-size:10.5px; font-weight:700; }
.st-active{ background:var(--green-bg); color:var(--green); }
.st-redeemed{ background:rgba(167,182,206,.14); color:var(--ink-2); }
.st-expired{ background:var(--red-bg); color:var(--red); }
.meal-card{ border:1px solid var(--line); border-radius:var(--radius); background:var(--surface); padding:13px 15px; margin-bottom:9px; box-shadow:var(--shadow-sm); }
.meal-head{ display:flex; align-items:center; gap:8px; margin-bottom:6px; }
.meal-type{ background:var(--accent-soft); color:var(--accent-deep); padding:3px 10px; border-radius:999px; font-size:11px; font-weight:700; }
.meal-time{ font-size:11px; color:var(--ink-3); }
.meal-text{ font-size:13.5px; line-height:1.5; white-space:pre-wrap; word-break:break-word; }
.meal-photo{ margin-top:8px; border-radius:10px; max-width:170px; max-height:170px; object-fit:cover; cursor:pointer; border:1px solid var(--line-strong); display:block; }
.coach-note{ margin-top:9px; background:var(--accent-soft); border-radius:10px; padding:9px 12px; font-size:12.5px; line-height:1.5; color:var(--accent-deep); }
.coach-note b{ display:block; font-size:10.5px; letter-spacing:.4px; margin-bottom:2px; }
.photo-pick{ display:flex; align-items:center; gap:10px; }
.photo-prev{ width:56px; height:56px; border-radius:10px; object-fit:cover; border:1px solid var(--line-strong); }
.overlay{ position:fixed; inset:0; background:rgba(4,9,20,.72); z-index:100; display:flex; align-items:center; justify-content:center; padding:20px; backdrop-filter:blur(4px); }
.panel{ background:var(--surface); border:1px solid var(--line-strong); border-radius:18px; max-width:420px; width:100%; max-height:86vh; overflow:auto; padding:18px; box-shadow:var(--shadow-md); }
.panel img.full{ width:100%; border-radius:12px; }
.qr-big{ width:230px; height:230px; margin:12px auto; background:#fff; padding:10px; border-radius:14px; }
.qr-big img,.qr-big canvas{ width:100% !important; height:100% !important; }
.info-row{ display:flex; justify-content:space-between; gap:10px; padding:10px 0; border-bottom:1px dashed var(--line); font-size:13.5px; }
.info-row:last-child{ border-bottom:none; }
.info-row .k{ color:var(--ink-2); }
.info-row .v{ font-weight:700; text-align:right; }
.done-banner{ display:flex; align-items:center; gap:9px; background:var(--green-bg); color:var(--green); border-radius:var(--radius-sm); padding:11px 14px; font-size:13.5px; font-weight:700; }
.done-banner svg{ width:19px; height:19px; flex-shrink:0; }
.hint{ font-size:11.5px; color:var(--ink-3); line-height:1.55; }
.divider{ height:1px; background:var(--line); margin:13px 0; }
.stamp-num{ font-size:42px; font-weight:800; line-height:1; color:var(--accent-deep); }
.stamp-cap{ font-size:12px; color:var(--ink-2); font-weight:700; margin-top:4px; }
.mood-tag{ display:inline-flex; align-items:center; padding:3px 10px; border-radius:999px; font-size:10px; font-weight:800; letter-spacing:1.5px; background:var(--accent-soft); color:var(--accent-deep); text-transform:uppercase; flex-shrink:0; }
.article-card{ border:1px solid var(--line); border-radius:var(--radius); background:var(--surface); padding:14px 15px; margin-bottom:9px; box-shadow:var(--shadow-sm); cursor:pointer; }
.article-photo{ width:100%; max-height:160px; object-fit:cover; border-radius:10px; margin-bottom:10px; display:block; }

.article-lock{ display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--ink-3); margin-top:6px; font-weight:600; }

<script>
var API_URL = "https://script.google.com/macros/s/AKfycbwQHtq7-3Ry1i7cVgblmIOnaLZSpfsKpZjpgiutP37ze_NP0Jn9TJ6pwXegwzt-t5yt/exec";
var CHART_COLOR = "#E9A63A";
var CHART_GRID = "#28395C", CHART_TICK = "#8CA0BF", CHART_INK = "#EDF2FA", CHART_CROSS = "#44587E";
var DAY_LABELS = { 1:"จันทร์", 2:"อังคาร", 3:"พุธ", 4:"พฤหัสบดี", 5:"ศุกร์", 6:"เสาร์", 7:"อาทิตย์" };
var TYPE_META = {
  cardio:{ label:"คาดิโอ" }, weights:{ label:"เวทเทรนนิ่ง" },
  mix:{ label:"คาดิโอ + เวท" }, rest:{ label:"วันพัก" }
};
var THAI_MONTHS = ["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];

var state = {
  view:"boot",          // boot | login | register | home
  tab:"program",        // program | meals | weight | card | profile
  auth:null,            // {phone, pin}
  data:null,            // getMyAll bundle
  promo:null,
  busy:false, openDays:{}, checks:{}, mealType:"เช้า", mealPhoto:null,
  loginErr:"", registerErr:"", claimLocation:""
};
var chartMeta = null;

/* ---------- utils ---------- */
var store = {
  get:function(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set:function(k,v){ try{ localStorage.setItem(k,v); }catch(e){} },
  del:function(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
function escapeHtml(s){ var d=document.createElement("div"); d.textContent=s==null?"":s; return d.innerHTML; }
function showToast(msg){ var t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t); setTimeout(function(){ t.remove(); },2400); }
function todayISO(){ var x=new Date(); return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0"); }
function todayDay(){ var d=new Date().getDay(); return d===0?7:d; }
function fmtDate(ds){ if(!ds) return ""; var p=String(ds).slice(0,10).split("-"); if(p.length<3) return escapeHtml(ds); return Number(p[2])+" "+THAI_MONTHS[Number(p[1])-1]; }
function fmtDateY(ds){ if(!ds) return ""; var p=String(ds).slice(0,10).split("-"); if(p.length<3) return escapeHtml(ds); return Number(p[2])+" "+THAI_MONTHS[Number(p[1])-1]+" "+String(Number(p[0])+543).slice(-2); }
function fmtDT(s){ if(!s) return ""; var str=String(s); return fmtDate(str.slice(0,10))+" "+str.slice(11,16); }
function num1(v){ var n=Number(v); return isNaN(n)?"-":(Math.round(n*10)/10).toLocaleString("th-TH"); }

async function apiCall(action, payload){
  var res;
  try{
    var body=new URLSearchParams({ action:action });
    if (payload) body.set("payload", JSON.stringify(payload));
    res=await fetch(API_URL,{ method:"POST", redirect:"follow", headers:{ "Content-Type":"text/plain;charset=utf-8" }, body:body.toString() });
  }catch(e){ throw new Error("เชื่อมต่อเครือข่ายไม่ได้"); }
  var text=await res.text();
  if (!res.ok) throw new Error("HTTP "+res.status);
  var data;
  try{ data=JSON.parse(text); }catch(e){ throw new Error("ข้อมูลจากเซิร์ฟเวอร์ไม่ถูกต้อง"); }
  if (data && data.error) throw new Error(data.error);
  return data;
}

function redeemUrl(code){
  try{ return new URL("fit-coupon.html?code="+encodeURIComponent(code), location.href).href; }
  catch(e){ return String(code); }
}
function cardUrl(clientId){
  try{ return new URL("fit-coupon.html?card="+encodeURIComponent(clientId), location.href).href; }
  catch(e){ return String(clientId); }
}
function renderQR(el, text, size){
  el.innerHTML="";
  if (typeof QRCode==="undefined"){ el.innerHTML='<div class="qr-fallback">'+escapeHtml(text)+'</div>'; return; }
  new QRCode(el, { text:text, width:size||192, height:size||192, colorDark:"#14223F", colorLight:"#FFFFFF", correctLevel:QRCode.CorrectLevel.M });
}
function paintQRs(){
  document.querySelectorAll("[data-qr]").forEach(function(el){
    if (el.dataset.qrdone) return;
    renderQR(el, el.dataset.qr, Number(el.dataset.qrsize||192));
    el.dataset.qrdone="1";
  });
}

/* ---------- boot ---------- */
async function boot(){
  var qs = new URLSearchParams(location.search);
  var wantPromo = qs.get("promo")==="1" || qs.get("register")==="1" || location.hash==="#promo" || location.hash==="#register";
  try{ state.promo = await apiCall("getPromo"); }catch(e){ state.promo = null; }
  if (wantPromo && state.promo && state.promo.enabled){ state.view="register"; render(); return; }
  var saved = store.get("fg_auth");
  if (saved){
    try{
      state.auth = JSON.parse(saved);
      state.data = await apiCall("getMyAll", state.auth);
      state.view = "home";
    }catch(e){ state.auth=null; store.del("fg_auth"); state.view="login"; }
  } else state.view="login";
  render();
}

/* ---------- actions ---------- */
async function doLogin(){
  var phone=document.getElementById("liPhone").value.trim();
  var pin=document.getElementById("liPin").value.trim();
  if(!phone||!pin){ state.loginErr="กรุณากรอกเบอร์โทรและ PIN"; render(); return; }
  state.busy=true; state.loginErr=""; render();
  try{
    var auth={ phone:phone, pin:pin };
    state.data = await apiCall("clientLogin", auth);
    state.auth = auth; store.set("fg_auth", JSON.stringify(auth));
    state.view="home"; state.tab="program";
  }catch(e){ state.loginErr=e.message; }
  state.busy=false; render();
}
function doLogout(){
  store.del("fg_auth");
  state.auth=null; state.data=null; state.view="login"; state.loginErr="";
  render();
}
async function refreshData(quiet){
  if(!state.auth) return;
  try{
    state.data = await apiCall("getMyAll", state.auth);
    document.getElementById("errorBox").innerHTML="";
    if(!quiet) showToast("อัปเดตข้อมูลแล้ว");
  }catch(e){
    document.getElementById("errorBox").innerHTML='<div class="err-box">เชื่อมต่อข้อมูลไม่สำเร็จ: '+escapeHtml(e.message)+'</div>';
  }
  render();
}
function setTab(t){ state.tab=t; render(); window.scrollTo(0,0); }
function toggleDay(d){ state.openDays[d]=!state.openDays[d]; render(); }
function toggleCheck(key, checked){ state.checks[key]=checked;
  var row=document.getElementById("ex-"+key); if(row) row.classList.toggle("checked", checked); }

async function markDone(day, title){
  if(state.busy) return;
  state.busy=true; render();
  try{
    state.data = await apiCall("logWorkout", Object.assign({}, state.auth, { day:day, title:title, status:"done" }));
    showToast("บันทึกการเทรนวันนี้แล้ว เก่งมาก!");
  }catch(e){ showToast(e.message); }
  state.busy=false; render();
}
async function sendComment(){
  var el=document.getElementById("chatInput");
  var text=el?el.value.trim():"";
  if(!text) return;
  state.busy=true;
  try{
    state.data = await apiCall("addComment", Object.assign({}, state.auth, { text:text }));
  }catch(e){ showToast(e.message); }
  state.busy=false; render();
  var list=document.getElementById("bubbleEnd"); if(list) list.scrollIntoView({block:"nearest"});
}
function setMealType(t){ state.mealType=t; render(); }
function pickPhoto(input){
  var f=input.files && input.files[0];
  if(!f) return;
  resizeImage(f, 900, 0.72).then(function(ph){ state.mealPhoto=ph; render(); })
    .catch(function(){ showToast("อ่านรูปไม่สำเร็จ ลองใหม่อีกครั้ง"); });
}
function removePhoto(){ state.mealPhoto=null; render(); }
function resizeImage(file, maxDim, q){
  return new Promise(function(resolve,reject){
    var url=URL.createObjectURL(file);
    var img=new Image();
    img.onload=function(){
      try{
        var scale=Math.min(1, maxDim/Math.max(img.width,img.height));
        var w=Math.max(1,Math.round(img.width*scale)), h=Math.max(1,Math.round(img.height*scale));
        var cv=document.createElement("canvas"); cv.width=w; cv.height=h;
        cv.getContext("2d").drawImage(img,0,0,w,h);
        var dataUrl=cv.toDataURL("image/jpeg", q);
        URL.revokeObjectURL(url);
        resolve({ base64:dataUrl.split(",")[1], mime:"image/jpeg", preview:dataUrl });
      }catch(e){ reject(e); }
    };
    img.onerror=reject;
    img.src=url;
  });
}
async function submitMeal(){
  var text=document.getElementById("mealText").value.trim();
  if(!text && !state.mealPhoto){ showToast("ใส่รายละเอียดหรือแนบรูปอาหารก่อนนะ"); return; }
  state.busy=true; render();
  try{
    var payload=Object.assign({}, state.auth, { mealType:state.mealType, text:text });
    if(state.mealPhoto){ payload.photoBase64=state.mealPhoto.base64; payload.photoMime=state.mealPhoto.mime; }
    state.data = await apiCall("addMeal", payload);
    state.mealPhoto=null;
    showToast("ส่งให้โค้ชแล้ว");
  }catch(e){ showToast(e.message); }
  state.busy=false; render();
}
async function submitWeight(){
  var date=document.getElementById("wDate").value || todayISO();
  var weight=document.getElementById("wKg").value;
  var waist=document.getElementById("wWaist").value;
  var note=document.getElementById("wNote").value.trim();
  if(!weight){ showToast("กรอกน้ำหนักก่อนนะ"); return; }
  state.busy=true; render();
  try{
    state.data = await apiCall("logWeight", Object.assign({}, state.auth, { date:date, weight:Number(weight), waist:waist===""?"":Number(waist), note:note }));
    showToast("บันทึกน้ำหนักแล้ว");
  }catch(e){ showToast(e.message); }
  state.busy=false; render();
}
async function registerCard(){
  var name=document.getElementById("rgName").value.trim();
  var phone=document.getElementById("rgPhone").value.trim();
  var pin=document.getElementById("rgPin").value.trim();
  if(!name||!phone){ state.registerErr="กรุณากรอกชื่อและเบอร์โทร"; render(); return; }
  if(!pin||pin.length<4){ state.registerErr="กรุณาตั้ง PIN อย่างน้อย 4 หลัก"; render(); return; }
  state.busy=true; state.registerErr=""; render();
  try{
    var auth={ phone:phone, pin:pin };
    state.data = await apiCall("clientSelfRegister", { name:name, phone:phone, pin:pin });
    state.auth=auth; store.set("fg_auth", JSON.stringify(auth));
    state.view="home"; state.tab="card";
  }catch(e){ state.registerErr=e.message; }
  state.busy=false; render();
}
function gotoRegister(){ state.view="register"; state.registerErr=""; render(); window.scrollTo(0,0); }
function gotoLogin(){ state.view="login"; render(); window.scrollTo(0,0); }
function openPhoto(url){ openOverlay('<img class="full" src="'+escapeHtml(url)+'" alt="รูปอาหาร">'); }
function openCouponZoom(code, title){
  openOverlay(
    '<div style="text-align:center">'+
    '<div style="font-size:15px;font-weight:800">'+escapeHtml(title)+'</div>'+
    '<div class="qr-big" data-qr="'+escapeHtml(redeemUrl(code))+'" data-qrsize="440"></div>'+
    '<div class="code-big">'+escapeHtml(code)+'</div>'+
    '<p class="hint" style="margin-top:8px">ยื่นหน้าจอนี้ให้พนักงานร้านสแกน หรือแจ้งโค้ดด้านบน</p>'+
    '<button class="btn-ghost btn-block" onclick="closeOverlay()" style="margin-top:6px">ปิด</button></div>');
  paintQRs();
}
function openOverlay(inner){
  closeOverlay();
  var ov=document.createElement("div");
  ov.className="overlay"; ov.id="overlay";
  ov.onclick=function(ev){ if(ev.target===ov) closeOverlay(); };
  ov.innerHTML='<div class="panel">'+inner+'</div>';
  document.body.appendChild(ov);
}
function closeOverlay(){ var ov=document.getElementById("overlay"); if(ov) ov.remove(); }

/* ---------- render ---------- */
function render(){
  var c=document.getElementById("content");
  var nav=document.getElementById("bottomNav");
  var actions=document.getElementById("appbarActions");
  nav.style.display = state.view==="home" ? "block" : "none";
  actions.innerHTML = (state.view==="home"
    ? '<button class="icon-btn" onclick="refreshData()" title="รีเฟรช"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg></button>'+
      '<button class="icon-btn" onclick="doLogout()" title="ออกจากระบบ"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg></button>'
    : "") + installBtnHtml();
  if (state.view==="boot"){ c.innerHTML='<div class="loading-text">กำลังโหลด...</div>'; return; }
  if (state.view==="login"){ c.innerHTML=renderLogin(); return; }
  if (state.view==="register"){ c.innerHTML=renderRegister(); return; }
  ["program","meals","weight","card","profile"].forEach(function(t){
    var el=document.getElementById("nav-"+t);
    if(el) el.classList.toggle("active", state.tab===t);
  });
  var html="";
  if (state.tab==="program") html=renderProgram();
  else if (state.tab==="meals") html=renderMeals();
  else if (state.tab==="weight") html=renderWeight();
  else if (state.tab==="card") html=renderCard();
  else html=renderProfile();
  c.innerHTML=html;
  paintQRs();
  bindChart();
}

function renderLogin(){
  var promoLink = (state.promo && state.promo.enabled)
    ? '<div class="promo-link" onclick="gotoRegister()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h11v5a4 4 0 0 1-4 4H9a4 4 0 0 1-4-4V8Z"/><path d="M16 9h2.5a2.5 2.5 0 0 1 0 5H16"/><path d="M8 3.4c-.5.7-.5 1.5 0 2.2M11 3.4c-.5.7-.5 1.5 0 2.2"/></svg>ลูกค้าร้านกาแฟ? แตะสมัครบัตรสะสมแต้มฟรี</div>'
    : "";
  return '<div class="login-hero">'+
    '<div class="biglogo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5v11M4 8.5v7M17.5 6.5v11M20 8.5v7M6.5 12h11"/></svg></div>'+
    '<div class="wm">FIT GRAVITY</div>'+
    '<div class="wm2">TRAINING ONLINE</div>'+
    '<div class="tg">โปรแกรมลดน้ำหนัก · คาดิโอ · เวทเทรนนิ่ง<br>ดูแลโดยเทรนเนอร์ส่วนตัว</div></div>'+
    '<div class="card">'+
    (state.loginErr?'<div class="err-box">'+escapeHtml(state.loginErr)+'</div>':"")+
    '<div class="field"><label class="label">เบอร์โทรศัพท์</label><input id="liPhone" type="tel" inputmode="tel" placeholder="08x-xxx-xxxx" autocomplete="tel"></div>'+
    '<div class="field"><label class="label">PIN (ได้รับจากโค้ช)</label><input id="liPin" type="password" inputmode="numeric" placeholder="••••" onkeydown="if(event.key===\'Enter\')doLogin()"></div>'+
    '<button class="btn-primary btn-block" onclick="doLogin()" '+(state.busy?"disabled":"")+'>'+(state.busy?"กำลังเข้าสู่ระบบ...":"เข้าสู่ระบบ")+'</button>'+
    '</div>'+promoLink+
    '<p class="hint" style="text-align:center;margin-top:14px">ยังไม่มีบัญชี? ติดต่อโค้ชเพื่อสมัครและรับ PIN</p>';
}

function renderRegister(){
  var p=state.promo||{};
  return '<div class="promo-head"><div class="k">สมัครบัตรสะสมแต้มฟรี</div>'+
    '<div class="t">'+escapeHtml(p.title||"สะสมแก้ว ลุ้นโปรแกรมเทรนฟรี")+'</div>'+
    '<div class="d">'+escapeHtml(p.desc||"")+'</div></div>'+
    '<div class="card">'+
    (state.registerErr?'<div class="err-box">'+escapeHtml(state.registerErr)+'</div>':"")+
    '<div class="field"><label class="label">ชื่อ-นามสกุล</label><input id="rgName" placeholder="ชื่อของคุณ"></div>'+
    '<div class="field"><label class="label">เบอร์โทรศัพท์</label><input id="rgPhone" type="tel" inputmode="tel" placeholder="08x-xxx-xxxx" autocomplete="tel"></div>'+
    '<div class="field"><label class="label">ตั้ง PIN (4 หลักขึ้นไป ใช้เข้าสู่ระบบครั้งถัดไป)</label><input id="rgPin" type="password" inputmode="numeric" placeholder="••••" onkeydown="if(event.key===\'Enter\')registerCard()"></div>'+
    '<button class="btn-primary btn-block" onclick="registerCard()" '+(state.busy?"disabled":"")+'>'+(state.busy?"กำลังสมัคร...":"สมัครบัตร รับ QR ทันที")+'</button>'+
    '<p class="hint" style="margin-top:10px">สมัครฟรี ไม่มีค่าใช้จ่าย · ให้พนักงานสแกนบัตรทุกครั้งที่ซื้อเครื่องดื่มเพื่อสะสมแต้ม</p></div>'+
    '<button class="btn-ghost btn-block" onclick="gotoLogin()">มีบัตรอยู่แล้ว — เข้าสู่ระบบ</button>';
}

/* ----- home: program ----- */
function renderProgram(){
  var d=state.data||{}, program=d.program||[], today=todayDay(), tISO=todayISO();
  var doneToday=(d.workouts||[]).some(function(w){ return w.date===tISO; });
  var html='<h1>สวัสดี '+escapeHtml((d.client||{}).name||"")+'</h1>'+
    '<p class="sub">โปรแกรมของคุณ · เป้าหมาย: '+escapeHtml((d.client||{}).goal||"-")+'</p>';
  if (!program.length){

function buildWeightChart(ws, target){
  var W=340,H=185,L=36,R=14,T=16,B=24;
  var data=ws.slice(-60);
  var xs=data.map(function(w){ return new Date(w.date+"T00:00:00").getTime(); });
  var ys=data.map(function(w){ return w.weight; });
  var minX=Math.min.apply(null,xs), maxX=Math.max.apply(null,xs);
  if(maxX===minX) maxX=minX+86400000;
  var lo=Math.min.apply(null,ys), hi=Math.max.apply(null,ys);
  if(target){ lo=Math.min(lo,target); hi=Math.max(hi,target); }
  var pad=Math.max(0.6,(hi-lo)*0.12); lo-=pad; hi+=pad;
  function X(t){ return L+(t-minX)/(maxX-minX)*(W-L-R); }
  function Y(v){ return T+(hi-v)/(hi-lo)*(H-T-B); }
  var ticks=[],n=4;
  for(var i=0;i<=n;i++) ticks.push(lo+(hi-lo)*i/n);
  var grid="",labels="";
  ticks.forEach(function(tv){
    var y=Y(tv);
    grid+='<line x1="'+L+'" y1="'+y+'" x2="'+(W-R)+'" y2="'+y+'" stroke="'+CHART_GRID+'" stroke-width="1"/>';
    labels+='<text x="'+(L-6)+'" y="'+(y+3)+'" font-size="9" fill="'+CHART_TICK+'" text-anchor="end">'+(Math.round(tv*10)/10)+'</text>';
  });
  var xIdx=[0, Math.floor((data.length-1)/2), data.length-1];
  var xlab="", seen={};
  xIdx.forEach(function(i){
    if(seen[i]) return; seen[i]=1;
    var x=X(xs[i]);
    var anchor = i===0?"start":(i===data.length-1?"end":"middle");
    xlab+='<text x="'+x+'" y="'+(H-7)+'" font-size="9" fill="'+CHART_TICK+'" text-anchor="'+anchor+'">'+fmtDate(data[i].date)+'</text>';
  });
  var pts=data.map(function(w,i){ return {x:X(xs[i]), y:Y(ys[i]), date:w.date, weight:w.weight}; });
  var path=pts.map(function(p,i){ return (i===0?"M":"L")+p.x.toFixed(1)+" "+p.y.toFixed(1); }).join(" ");
  var area=path+" L"+pts[pts.length-1].x.toFixed(1)+" "+(H-B)+" L"+pts[0].x.toFixed(1)+" "+(H-B)+" Z";
  var targetLine="";
  if(target){
    var ty=Y(target);
    targetLine='<line x1="'+L+'" y1="'+ty+'" x2="'+(W-R)+'" y2="'+ty+'" stroke="'+CHART_TICK+'" stroke-width="1.4" stroke-dasharray="5 4"/>'+
      '<text x="'+(W-R)+'" y="'+(ty-4)+'" font-size="9" fill="'+CHART_TICK+'" text-anchor="end" font-weight="700">เป้า '+num1(target)+'</text>';
  }
  var last=pts[pts.length-1];
  chartMeta={ points:pts, W:W };
  return '<div class="chart-box" id="chartBox">'+
    '<svg viewBox="0 0 '+W+' '+H+'" id="wchart" role="img" aria-label="กราฟน้ำหนัก">'+
    '<defs><linearGradient id="wgrad" x1="0" y1="0" x2="0" y2="1">'+
    '<stop offset="0" stop-color="'+CHART_COLOR+'" stop-opacity="0.16"/><stop offset="1" stop-color="'+CHART_COLOR+'" stop-opacity="0"/></linearGradient></defs>'+
    grid+labels+xlab+targetLine+
    '<path d="'+area+'" fill="url(#wgrad)"/>'+
    '<path d="'+path+'" fill="none" stroke="'+CHART_COLOR+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>'+
    '<line id="chartCross" x1="0" y1="'+T+'" x2="0" y2="'+(H-B)+'" stroke="'+CHART_CROSS+'" stroke-width="1" style="display:none"/>'+
    '<circle id="chartDot" r="4" fill="'+CHART_COLOR+'" stroke="#14223F" stroke-width="2" style="display:none"/>'+
    '<circle cx="'+last.x+'" cy="'+last.y+'" r="3.6" fill="'+CHART_COLOR+'" stroke="#14223F" stroke-width="2"/>'+
    '<text x="'+Math.min(last.x, W-R-4)+'" y="'+(last.y-9)+'" font-size="10.5" font-weight="800" fill="'+CHART_INK+'" text-anchor="'+(last.x>W-60?"end":"middle")+'">'+num1(last.weight)+'</text>'+
    '</svg><div class="chart-tip" id="chartTip"></div></div>';
}
function bindChart(){
  var box=document.getElementById("chartBox");
  if(!box||!chartMeta) return;
  var svg=box.querySelector("svg"), tip=document.getElementById("chartTip");
  var cross=svg.querySelector("#chartCross"), dot=svg.querySelector("#chartDot");
  function onMove(ev){
    var rect=svg.getBoundingClientRect();
    var cx=(ev.clientX!=null?ev.clientX:(ev.touches&&ev.touches[0]?ev.touches[0].clientX:0))-rect.left;
    var sx=cx*(chartMeta.W/rect.width);
    var best=null,bd=1e9;
    chartMeta.points.forEach(function(p){ var d=Math.abs(p.x-sx); if(d<bd){bd=d;best=p;} });
    if(!best) return;
    cross.setAttribute("x1",best.x); cross.setAttribute("x2",best.x); cross.style.display="block";
    dot.setAttribute("cx",best.x); dot.setAttribute("cy",best.y); dot.style.display="block";
    var px=best.x*(rect.width/chartMeta.W);
    tip.style.left=Math.min(Math.max(px,54),rect.width-54)+"px";
    tip.style.display="block";
    tip.textContent=fmtDate(best.date)+" · "+num1(best.weight)+" กก.";
  }
  function onLeave(){ cross.style.display="none"; dot.style.display="none"; tip.style.display="none"; }
  svg.addEventListener("pointermove",onMove);
  svg.addEventListener("pointerdown",onMove);
  svg.addEventListener("pointerleave",onLeave);
}

function milestoneBlock(milestoneKey, threshold, stampCount, claimedAt, rewardTitle, rewardDesc, rewards){
  var pct=threshold>0?Math.min(100,Math.round(stampCount/threshold*100)):0;
  var right;
  if(!claimedAt && stampCount>=threshold){
    right='<button class="btn-primary" onclick="openClaimMilestone(\''+milestoneKey+'\')" style="padding:8px 14px;font-size:12.5px;flex-shrink:0">รับรางวัล</button>';
  } else if(!claimedAt){
    right='<span class="hint" style="flex-shrink:0">อีก '+(threshold-stampCount)+' แต้ม</span>';
  } else {
    var matches=rewards.filter(function(r){ return String(r.milestone)===String(milestoneKey); });
    var rw=matches.length?matches[0]:null;
    right = (rw && rw.status==="fulfilled")
      ? '<span class="st-chip st-active" style="flex-shrink:0">จัดโปรแกรมแล้ว</span>'
      : '<span class="st-chip" style="flex-shrink:0;background:var(--amber-bg);color:var(--amber)">รอโค้ชจัดโปรแกรม</span>';
  }
  return '<div class="ms-row">'+
    '<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:7px">'+
    '<div><div style="font-size:13.5px;font-weight:800">'+escapeHtml(rewardTitle)+'</div>'+
    '<div class="hint">'+escapeHtml(rewardDesc)+'</div></div>'+right+'</div>'+
    '<div class="pkg-bar" style="margin:0"><div class="pkg-fill" style="width:'+pct+'%"></div></div>'+
    '<div class="hint" style="margin-top:4px">'+Math.min(stampCount,threshold)+' / '+threshold+' แต้ม</div>'+
    '</div>';
}

function renderArticles(articles){
  if(!articles.length) return '<div class="empty">ยังไม่มีบทความ<br>รอเทรนเนอร์อัปเดตเร็ว ๆ นี้</div>';
  var html="";
  articles.forEach(function(a){
    if(a.unlocked){
      html+='<div class="article-card" onclick="openArticle(\''+escapeJs(a.articleId)+'\')">'+
        (a.photoUrl?'<img class="article-photo" loading="lazy" src="'+escapeHtml(a.photoUrl)+'" alt="'+escapeHtml(a.title)+'">':"")+
        '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">'+
        '<div style="font-size:14px;font-weight:800;line-height:1.4">'+escapeHtml(a.title)+'</div>'+
        (a.mood?'<span class="mood-tag">'+escapeHtml(a.mood)+'</span>':"")+
        '</div><div class="hint" style="margin-top:5px">อัปเดต '+fmtDateY(a.publishDate)+(a.videoUrl?' · '+icPlay()+' มีคลิปประกอบ':"")+'</div></div>';
    } else {
      html+='<div class="article-card locked">'+
        '<div style="font-size:14px;font-weight:800;line-height:1.4;color:var(--ink-2)">'+escapeHtml(a.title)+'</div>'+
        '<div class="article-lock">'+icLock()+'ซื้อเครื่องดื่มแล้วให้พนักงานสแกน เพื่อปลดล็อกตั้งแต่ '+fmtDateY(a.publishDate)+'</div></div>';
    }
  });

}
function openArticle(articleId){
  var d=state.data||{}, list=d.articles||[], a=null;
  list.forEach(function(x){ if(x.articleId===articleId) a=x; });
  if(!a || !a.unlocked) return;
  openOverlay(
    (a.mood?'<div class="mood-tag" style="margin-bottom:8px">'+escapeHtml(a.mood)+'</div>':"")+
    '<div style="font-size:17px;font-weight:800;line-height:1.4;margin-bottom:4px">'+escapeHtml(a.title)+'</div>'+
    '<div class="hint" style="margin-bottom:12px">อัปเดต '+fmtDateY(a.publishDate)+'</div>'+
    (a.photoUrl?'<img class="full" style="margin-bottom:12px" src="'+escapeHtml(a.photoUrl)+'" alt="'+escapeHtml(a.title)+'">':"")+
    '<div style="font-size:14px;line-height:1.75;white-space:pre-wrap;word-break:break-word">'+escapeHtml(a.body)+'</div>'+
    (a.videoUrl?'<a class="btn-ghost btn-block" style="margin-top:12px;display:flex;align-items:center;justify-content:center;gap:7px;text-decoration:none" href="'+escapeHtml(a.videoUrl)+'" target="_blank" rel="noopener">'+icPlay()+'ดูคลิปประกอบ</a>':"")+
    '<button class="btn-ghost btn-block" onclick="closeOverlay()" style="margin-top:8px">ปิด</button>'
  );
}

function renderFastTrackCard(ft){

    '<div style="font-size:14px;font-weight:800;line-height:1.4;margin-top:7px">ใจร้อน? จ่าย '+num1(ft.price||1990)+' บาท รับสิทธิ์ทันที</div>'+
    '<div class="hint" style="margin-top:5px;line-height:1.6">เมนูสุขภาพ '+(ft.mealQuota||30)+' สิทธิ์/เดือน (มูลค่าไม่เกินสิทธิ์ละ '+(ft.mealValue||85)+' บาท) พร้อมเทรนฟรี '+(ft.months||1)+' เดือน</div>'+
    '<div class="hint" style="margin-top:7px">แจ้งพนักงานหน้าร้านหรือโค้ชเพื่อชำระเงินและรับสิทธิ์ได้เลย</div>'+
    '</div>';
}

function openClaimMilestone(milestone){
  state.claimLocation="";
  var goalChips=["ลดน้ำหนัก","วิ่ง","เพิ่มกล้ามเนื้อ","ฟิตทั่วไป"];
  var chipsHtml="";
  goalChips.forEach(function(g){ chipsHtml+='<span class="chip" onclick="pickGoalChip(\''+g+'\')">'+g+'</span>'; });
  openOverlay(
    '<div style="text-align:center">'+
    '<div style="font-size:15px;font-weight:800;margin-bottom:4px">เคลมรางวัล '+(milestone==="15"?"เทรนฟรี 15 วัน":"โปรแกรมออนไลน์ฟรี 1 เดือน")+'</div>'+
    '<p class="hint" style="margin-bottom:14px">เลือกรูปแบบและเป้าหมาย แล้วโค้ชจะจัดโปรแกรมให้คุณ</p>'+
    '<div style="text-align:left">'+
    '<label class="label">สถานที่เทรน</label>'+
    '<div class="row" style="margin-bottom:13px">'+
    '<div class="chip" id="locGym" style="flex:1;text-align:center" onclick="selectClaimLocation(\'gym\')">ในยิม</div>'+
    '<div class="chip" id="locHome" style="flex:1;text-align:center" onclick="selectClaimLocation(\'home\')">ที่บ้าน</div>'+
    '</div>'+
    '<label class="label">เป้าหมาย</label>'+
    '<div class="chiprow" style="padding-bottom:8px">'+chipsHtml+'</div>'+
    '<div class="field"><input id="claimGoalInput" placeholder="พิมพ์เป้าหมายของคุณ"></div>'+
    '</div>'+
    '<button class="btn-primary btn-block" onclick="submitClaimMilestone(\''+milestone+'\')" '+(state.busy?"disabled":"")+'>ยืนยันรับรางวัล</button>'+
    '<button class="btn-ghost btn-block" onclick="closeOverlay()" style="margin-top:8px">ยกเลิก</button>'+
    '</div>'
  );
}
function selectClaimLocation(loc){
  state.claimLocation=loc;
  var g=document.getElementById("locGym"), h=document.getElementById("locHome");
  if(g) g.classList.toggle("active", loc==="gym");
  if(h) h.classList.toggle("active", loc==="home");
}
function pickGoalChip(g){
  var el=document.getElementById("claimGoalInput");
  if(el) el.value=g;
}
async function submitClaimMilestone(milestone){
  if(state.busy) return;
  var el=document.getElementById("claimGoalInput");
  var goal=el?el.value.trim():"";
  if(!state.claimLocation){ showToast("กรุณาเลือกสถานที่เทรน"); return; }
  if(!goal){ showToast("กรุณากรอกเป้าหมาย"); return; }
  state.busy=true;
  try{
    state.data = await apiCall("clientClaimMilestone", Object.assign({}, state.auth, { milestone:milestone, location:state.claimLocation, goal:goal }));
    closeOverlay();
    showToast("รับรางวัลสำเร็จ! รอโค้ชจัดโปรแกรมให้คุณ");
  }catch(e){ showToast(e.message); }
  state.busy=false; render();
}

/* ----- home: package & coupons (inside การ์ด tab) ----- */
function renderPackageCoupons(d){
  var c=d.client||{}, coupons=d.coupons||[];
  var total=Number(c.sessionsTotal||0), used=Number(c.sessionsUsed||0), left=Math.max(0,total-used);
  var pct= total>0 ? Math.min(100,Math.round(used/total*100)) : 0;
  var html='<h2>แพ็กเกจเทรนของฉัน</h2>';
  if (total>0){
    var expSoon = c.packageExpiry && daysUntil(c.packageExpiry)<=7 && daysUntil(c.packageExpiry)>=0;
    var expired = c.packageExpiry && daysUntil(c.packageExpiry)<0;
    html+='<div class="card"><div style="display:flex;align-items:baseline;gap:8px">'+
      '<div class="pkg-num">'+left+'</div><div style="font-size:13px;color:var(--ink-2);font-weight:700">ครั้ง คงเหลือ · '+escapeHtml(c.packageName||"แพ็กเกจเทรน")+'</div></div>'+
      '<div class="pkg-bar"><div class="pkg-fill" style="width:'+pct+'%"></div></div>'+
      '<div style="display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-3)"><span>ใช้ไป '+used+'/'+total+' ครั้ง</span>'+
      (c.packageExpiry?'<span>หมดอายุ '+fmtDateY(c.packageExpiry)+'</span>':"")+'</div>'+
      (left<=2&&left>0?'<span class="warn-chip">เหลือ '+left+' ครั้ง — ต่อแพ็กเกจกับโค้ชได้เลย</span>':"")+
      (expSoon?'<span class="warn-chip">ใกล้หมดอายุ</span>':"")+
      (expired?'<span class="warn-chip red">แพ็กเกจหมดอายุแล้ว</span>':"")+
      (left===0?'<span class="warn-chip red">ครบทุกครั้งแล้ว — คุยกับโค้ชเพื่อต่อแพ็กเกจ</span>':"")+
      '</div>';
  } else {
    html+='<div class="card"><p class="hint" style="margin:0">ยังไม่มีแพ็กเกจ — สอบถามแพ็กเกจเทรนกับโค้ชได้ในแท็บโปรแกรม</p></div>';
  }
  var active=coupons.filter(function(x){ return x.status==="active"; });
  var others=coupons.filter(function(x){ return x.status!=="active"; });
  html+='<h2>คูปองของฉัน</h2>';
  if(!coupons.length) html+='<div class="empty">ยังไม่มีคูปอง<br>เทรนสม่ำเสมอแล้วรอรับรางวัลจากโค้ชได้เลย</div>';
  active.forEach(function(cp){ html+=ticketHtml(cp,false); });
  if (others.length){
    html+='<h2 style="color:var(--ink-3)">ใช้แล้ว / หมดอายุ</h2>';
    others.slice(0,8).forEach(function(cp){ html+=ticketHtml(cp,true); });
  }
  return html;
}
function ticketHtml(cp, dim){
  var isVoucher = cp.kind==="mealVoucher";
  var stChip = cp.status==="active" ? '<span class="st-chip st-active">ใช้งานได้</span>'
    : cp.status==="redeemed" ? '<span class="st-chip st-redeemed">'+(isVoucher?"ใช้ครบแล้ว":"ใช้แล้ว")+'</span>'
    : cp.status==="cancelled" ? '<span class="st-chip st-redeemed">ยกเลิก</span>'
    : '<span class="st-chip st-expired">หมดอายุ</span>';
  var sub;
  if (isVoucher){
    sub = "ใช้ไปแล้ว "+(cp.quotaUsed||0)+"/"+(cp.quotaTotal||0)+" สิทธิ์ · ถึง "+fmtDateY(cp.expiresAt);
  } else {
    sub = cp.status==="redeemed" ? "ใช้เมื่อ "+fmtDT(cp.redeemedAt)+(cp.redeemedBy?" · "+escapeHtml(cp.redeemedBy):"")
      : "ใช้ได้ถึง "+fmtDateY(cp.expiresAt);
  }
  var html='<div class="ticket'+(dim?" dim":"")+'"><div class="ticket-top">'+
    '<div class="ticket-ic'+(cp.kind==="coffee"||isVoucher?" coffee":"")+'">'+(cp.kind==="coffee"||isVoucher?icCoffee():icFit())+'</div>'+
    '<div class="ticket-body"><div class="ticket-title">'+escapeHtml(cp.title)+'</div>'+
    '<div class="ticket-sub">'+sub+'</div></div>'+stChip+'</div>';
  if (cp.status==="active"){
    html+='<div class="ticket-cut"></div><div class="ticket-bottom">'+
      '<div class="qr-slot" data-qr="'+escapeHtml(redeemUrl(cp.code))+'" onclick="openCouponZoom(\''+escapeJs(cp.code)+'\',\''+escapeJs(cp.title)+'\')"></div>'+
      '<div><div class="code-big">'+escapeHtml(cp.code)+'</div>'+
      '<div class="hint" style="margin-top:5px">'+(isVoucher?"ยื่นให้พนักงานสแกนทุกครั้งที่ใช้สิทธิ์เมนูสุขภาพ":(cp.kind==="coffee"?"ยื่นให้พนักงานร้านกาแฟสแกน หรือแตะ QR เพื่อขยาย":"แจ้งโค้ชเพื่อใช้สิทธิ์นี้"))+'</div></div></div>';
  }
  html+='</div>';
  return html;
}
function daysUntil(ds){
  try{ return Math.floor((new Date(ds+"T23:59:59")-new Date())/86400000); }catch(e){ return 999; }
}

function renderCoachSection(ti){

function escapeJs(s){ return String(s==null?"":s).replace(/\\/g,"\\\\").replace(/'/g,"\\'").replace(/"/g,"&quot;").replace(/\n/g," "); }

/* ---------- polling ---------- */
function inputActive(){
  var el=document.activeElement;
  if (el && (el.tagName==="INPUT"||el.tagName==="TEXTAREA") ) return true;
  if (document.getElementById("overlay")) return true;
  if (state.mealPhoto) return true;
  var ci=document.getElementById("chatInput"); if(ci&&ci.value) return true;
  var mt=document.getElementById("mealText"); if(mt&&mt.value) return true;
  return false;
}
setInterval(async function(){
  if (state.view!=="home" || document.hidden || state.busy || inputActive()) return;
  try{
    var d=await apiCall("getMyAll", state.auth);
    state.data=d; render();
  }catch(e){}
}, 30000);

/* ---------- PWA install ---------- */
var deferredInstallPrompt = null;
var pwaIsIOS = /iP(hone|od|ad)/.test(navigator.userAgent) && !window.MSStream;
var pwaIsStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;

function installBtnHtml(){
  if (pwaIsStandalone) return "";
  if (!deferredInstallPrompt && !pwaIsIOS) return "";
  return '<button class="install-btn" onclick="onInstallClick()" title="ติดตั้งแอปลงเครื่อง">'+
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0-4-4m4 4 4-4"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>'+
    '<span>ติดตั้งแอป</span></button>';
}

window.addEventListener('beforeinstallprompt', function(e){
  e.preventDefault();
  deferredInstallPrompt = e;
  render();
});
window.addEventListener('appinstalled', function(){
  deferredInstallPrompt = null;
  pwaIsStandalone = true;
  render();
});

function onInstallClick(){
  if (deferredInstallPrompt){
    deferredInstallPrompt.prompt();
    deferredInstallPrompt.userChoice.then(function(){ deferredInstallPrompt=null; render(); });
    return;
  }
  showInstallHelp();
}

function showInstallHelp(){
  var old=document.getElementById("pwaHelpOverlay"); if(old) old.remove();
  var box=document.createElement("div");
  box.id="pwaHelpOverlay";
  box.style.cssText="position:fixed;inset:0;background:rgba(6,11,22,.72);z-index:400;display:flex;align-items:flex-end;justify-content:center";
  box.onclick=function(e){ if(e.target===box) box.remove(); };
  box.innerHTML='<div style="background:var(--surface);border:1px solid var(--line);border-radius:18px 18px 0 0;padding:20px 18px 26px;max-width:480px;width:100%">'+
    '<div style="font-weight:800;font-size:15px;margin-bottom:10px">วิธีติดตั้งแอปลงเครื่อง</div>'+
    '<div style="font-size:13px;color:var(--ink-2);line-height:1.85">'+
    (pwaIsIOS
      ? '1. แตะปุ่มแชร์ (สี่เหลี่ยมมีลูกศรชี้ขึ้น) แถบด้านล่างของ Safari<br>2. เลื่อนหา แล้วแตะ “เพิ่มไปยังหน้าจอโฮม” (Add to Home Screen)<br>3. แตะ “เพิ่ม” ที่มุมขวาบน'
      : '• iPhone: เปิดด้วย Safari แล้วแตะปุ่มแชร์ 􀈂 ด้านล่าง เลือก “เพิ่มไปยังหน้าจอโฮม”<br>• Android: เปิดด้วย Chrome แตะเมนู ⋮ มุมขวาบน เลือก “ติดตั้งแอป” หรือ “เพิ่มไปยังหน้าจอโฮม”')+
    '</div>'+
    '<button class="btn-primary btn-block" style="margin-top:16px" onclick="document.getElementById(\'pwaHelpOverlay\').remove()">เข้าใจแล้ว</button>'+
    '</div>';
  document.body.appendChild(box);
}

if ('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}

boot();
